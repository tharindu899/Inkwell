name: Build & Release APK (Native Kotlin)

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main          # every push to main → build + release
  workflow_dispatch:  # manual "Run workflow" button

permissions:
  contents: write     # needed to create GitHub Releases

env:
  # Added to the run number so versionCode is always higher than your old
  # Capacitor APK. Android refuses to update an app with a LOWER versionCode.
  VERSION_CODE_OFFSET: 1000

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Check signing secrets ─────────────────────────────────────────────
      # All 4 present → signed release APK (can update your installed app).
      # Missing       → debug APK, so the build still works in a fresh repo.
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "signed=true" >> $GITHUB_OUTPUT
            echo "✅ Signing secrets found → release build"
          else
            echo "signed=false" >> $GITHUB_OUTPUT
            echo "⚠️ Signing secrets missing → debug build (add KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD for a release build)"
          fi

      # ── 3. Derive version from run number ────────────────────────────────────
      #   run #45 → v1.4.5     run #106 → v2.0.6
      - name: Derive version from run number
        run: |
          RUN=${{ github.run_number }}
          MAJOR=$(( RUN / 100 + 1 ))
          MINOR=$(( (RUN % 100) / 10 ))
          PATCH=$(( RUN % 10 ))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"
          CODE=$(( RUN + VERSION_CODE_OFFSET ))
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "VERSION_CODE=${CODE}" >> $GITHUB_ENV
          echo "APK_NAME=Inkwell-${TAG}.apk" >> $GITHUB_ENV
          echo "▸ Run #${RUN} → ${TAG} (versionCode ${CODE})"

      # ── 4. Java ──────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 5. Android SDK ───────────────────────────────────────────────────────
      # packages: '' → skip the default "tools" package, it no longer exists
      # in sdkmanager and makes this step fail ("Failed to find package 'tools'").
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # ── 6. Gradle (no gradlew needed, version is pinned here) ────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ── 7. Decode keystore (release only) ────────────────────────────────────
      - name: Decode keystore
        if: steps.signing.outputs.signed == 'true'
        run: |
          KEYSTORE_PATH="${{ github.workspace }}/inkwell-release.jks"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV

      - name: Print release keystore SHA-1
        if: steps.signing.outputs.signed == 'true'
        run: |
          SHA1=$(keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.STORE_PASSWORD }}" \
            -noprompt 2>/dev/null | grep "SHA1:" | head -1 | awk '{print $2}')
          echo "### 🔑 Release Keystore SHA-1" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$SHA1" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "📋 Package name: **com.inkwell.notes**" >> $GITHUB_STEP_SUMMARY

      # ── 8. Build ─────────────────────────────────────────────────────────────
      - name: Build release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace \
            -PappVersionName=$VERSION -PappVersionCode=$VERSION_CODE \
            2>&1 | tee /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        run: |
          gradle assembleDebug --stacktrace \
            -PappVersionName=$VERSION -PappVersionCode=$VERSION_CODE \
            2>&1 | tee /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      # ── 9. Rename APK ────────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            SRC="app/build/outputs/apk/release/app-release.apk"
          else
            SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          mv "$SRC" "app/build/outputs/${APK_NAME}"
          echo "APK_PATH=app/build/outputs/${APK_NAME}" >> $GITHUB_ENV

      # ── 10. Upload artifact ──────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # ── 11. GitHub Release ───────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Inkwell ${{ env.TAG }}"
          body: |
            ## Inkwell ${{ env.TAG }} (native Kotlin)

            Built from run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ### Install
            1. Download `${{ env.APK_NAME }}` below
            2. On your Android phone: Settings → Security → enable **Install unknown apps**
            3. Open the downloaded APK and tap Install
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: ${{ steps.signing.outputs.signed != 'true' }}

      # ── 12. Summaries ────────────────────────────────────────────────────────
      - name: Write success summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ✅ Build Succeeded
          | Field | Value |
          |-------|-------|
          | **Version** | \`${{ env.TAG }}\` (code ${{ env.VERSION_CODE }}) |
          | **Type** | ${{ steps.signing.outputs.signed == 'true' && 'Signed release' || 'Debug (no signing secrets)' }} |
          | **APK** | \`${{ env.APK_NAME }}\` |
          | **Commit** | [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          EOF

      - name: Write failure summary
        if: failure()
        run: |
          GRADLE_LOG=""
          if [ -f /tmp/gradle-build.log ]; then
            GRADLE_LOG=$(grep -E "^e: |error:|FAILED|What went wrong" -A3 /tmp/gradle-build.log | head -60)
          fi
          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          ## ❌ Build Failed
          ### Compiler / Gradle errors
          \`\`\`
          ${GRADLE_LOG:-No Gradle log captured — check the step logs above.}
          \`\`\`
          SUMMARY
