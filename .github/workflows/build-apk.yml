name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK (Kotlin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          missing=0
          for key in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD VITE_GOOGLE_CLIENT_ID; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "❌ Missing GitHub Secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then exit 1; fi
          echo "✅ Required secrets are present"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME) — no extra setup action needed
      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # run #45 -> v1.4.5   run #106 -> v2.0.6
      - name: Derive version from run number
        run: |
          RUN=${{ github.run_number }}
          MAJOR=$(( RUN / 100 + 1 ))
          MINOR=$(( (RUN % 100) / 10 ))
          PATCH=$(( RUN % 10 ))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=v${VERSION}" >> $GITHUB_ENV
          echo "APK_NAME=Inkwell-v${VERSION}.apk" >> $GITHUB_ENV
          echo "RUN_NUMBER=${RUN}" >> $GITHUB_ENV

      - name: Decode keystore
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/inkwell-release.jks"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV

      - name: Print release keystore SHA-1
        run: |
          SHA1=$(keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.STORE_PASSWORD }}" \
            -noprompt 2>/dev/null | grep "SHA1:" | head -1 | awk '{print $2}')
          echo "### 🔑 Release Keystore SHA-1" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$SHA1" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "📋 Package name: **com.inkwell.notes**" >> $GITHUB_STEP_SUMMARY

      - name: Build release APK
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/${{ env.APK_NAME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: app/build/outputs/apk/release/${{ env.APK_NAME }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Inkwell ${{ env.TAG }}"
          body: |
            ## Inkwell ${{ env.TAG }}
            Built from run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            1. Download `${{ env.APK_NAME }}`
            2. Allow **Install unknown apps** on your phone
            3. Open the APK and tap Install
          files: app/build/outputs/apk/release/${{ env.APK_NAME }}

      - name: Failure summary
        if: failure()
        run: |
          LOG=""
          if [ -f /tmp/gradle-build.log ]; then LOG=$(tail -100 /tmp/gradle-build.log); fi
          {
            echo "## ❌ Build Failed"
            echo "### Last 100 lines of Gradle log"
            echo '```'
            echo "${LOG:-No Gradle log captured}"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
